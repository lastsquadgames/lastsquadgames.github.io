<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Squad</title>
  <style>
    :root { color-scheme: light dark; --ink: #17202e; --muted: #5a6475; --bg: #9fd8ff; --card: #ffffff; --accent: #2a8cff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e8ecf2; --muted: #a3acb9; --bg: #12161d; --card: #1c222c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); }
    .card { margin: 16px; max-width: 520px; padding: 32px 24px; border-radius: 20px; background: var(--card); text-align: center; }
    h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
    h1 span { display: block; font-size: 18px; letter-spacing: 8px; color: #f0b429; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>LAST</span>SQUAD</h1>
    <p style="margin-top:-4px;font-weight:700;color:var(--ink)">by LastSquad Games</p>
    <p>Lead your squad through five worlds of gates, enemy hordes and giant bosses. A free action game for Android.</p>
    <p><a href="privacy-policy.html">Privacy Policy</a></p>
    <p>Contact: <a href="mailto:farazzulfiqar26@gmail.com">farazzulfiqar26@gmail.com</a></p>
  </div>
</body>
</html>
